site_name: Web Security & Full-Stack Engineering Interview Handbook
site_description: Sequential attack-first web security and full-stack interview preparation.
site_url: https://shrikant92bhatt.github.io/web-security-handbook/
repo_url: https://github.com/Shrikant92Bhatt/web-security-handbook
repo_name: Shrikant92Bhatt/web-security-handbook
docs_dir: .
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

exclude_docs: |
  /site/
  /.github/
  /AGENTS.md
  /CONTRIBUTING.md
  /PLAN.md
  /requirements-docs.txt

nav:
  - Home: README.md
  - Module 1 · Attack & Web Security:
      - Start here: docs/MODULE-1-ATTACK-SECURITY-PATH.md
      - Attack catalog: docs/ATTACK-CATALOG.md
      - Attack playbook template: docs/ATTACK-PLAYBOOK-TEMPLATE.md
      - 01 · Foundations: 00-foundations/README.md
      - 02 · Browser & frontend security: 01-browser-and-frontend/README.md
      - 03 · Authentication & sessions: 02-authentication-and-sessions/README.md
      - 04 · Authorization: 03-authorization/README.md
      - 05 · API security: 04-api-security/README.md
      - 06 · Injection attacks: 05-injection-attacks/README.md
      - 07 · HTTP & network security: 06-http-network-and-headers/README.md
      - 08 · Data & database security: 07-data-and-database/README.md
      - 09 · File handling & serialization: 08-file-upload-and-serialization/README.md
      - 10 · Cloud infrastructure & DevSecOps: 09-cloud-infrastructure-devsecops/README.md
      - 11 · Modern applications: 10-modern-apps-and-microfrontends/README.md
      - 12 · Security testing: 11-security-testing-and-tools/README.md
      - 13 · Prevention checklists: 12-prevention-checklists/README.md
      - Security bootcamp: bootcamp/README.md
  - Module 2 · Full-Stack & Interview Prep:
      - Start here: 15-fullstack-interview/README.md
      - 01 · HTTP & Web Fundamentals: 15-fullstack-interview/01-http-and-web-fundamentals.md
      - 02 · JavaScript & TypeScript: 15-fullstack-interview/02-javascript-typescript.md
      - 03 · Core Web Development: 15-fullstack-interview/core-web-development/README.md
      - 04 · Frontend — React & Angular: 15-fullstack-interview/03-frontend-react-angular.md
      - 05 · Backend — Node.js & APIs: 15-fullstack-interview/04-backend-nodejs.md
      - Node.js deep dive:
