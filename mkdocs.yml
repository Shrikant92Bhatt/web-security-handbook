site_name: Web Security & Full-Stack Engineering Interview Handbook
site_description: Sequential attack-first web security and full-stack interview preparation.
site_url: https://shrikant92bhatt.github.io/web-security-handbook/
repo_url: https://github.com/Shrikant92Bhatt/web-security-handbook
repo_name: Shrikant92Bhatt/web-security-handbook
docs_dir: .
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

exclude_docs: |
  /site/
  /.github/
  /AGENTS.md
  /CONTRIBUTING.md
  /PLAN.md
  /requirements-docs.txt

nav:
  - Home: README.md
  - Module 1 · Attack & Web Security:
      - Start here: Module-1-Attack-and-Web-Security/README.md
      - Sequential reading path: Module-1-Attack-and-Web-Security/docs/MODULE-1-ATTACK-SECURITY-PATH.md
      - Attack catalog: Module-1-Attack-and-Web-Security/docs/ATTACK-CATALOG.md
      - Attack playbook template: Module-1-Attack-and-Web-Security/docs/ATTACK-PLAYBOOK-TEMPLATE.md
      - 01 · Foundations: Module-1-Attack-and-Web-Security/00-foundations/README.md
      - 02 · Browser & frontend security: Module-1-Attack-and-Web-Security/01-browser-and-frontend/README.md
      - 03 · Authentication & sessions: Module-1-Attack-and-Web-Security/02-authentication-and-sessions/README.md
      - 04 · Authorization: Module-1-Attack-and-Web-Security/03-authorization/README.md
      - 05 · API security: Module-1-Attack-and-Web-Security/04-api-security/README.md
      - 06 · Injection attacks: Module-1-Attack-and-Web-Security/05-injection-attacks/README.md
      - 07 · HTTP & network security: Module-1-Attack-and-Web-Security/06-http-network-and-headers/README.md
      - 08 · Data & database security: Module-1-Attack-and-Web-Security/07-data-and-database/README.md
      - 09 · File handling & serialization: Module-1-Attack-and-Web-Security/08-file-upload-and-serialization/README.md
      - 10 · Cloud infrastructure & DevSecOps: Module-1-Attack-and-Web-Security/09-cloud-infrastructure-devsecops/README.md
      - 11 · Modern applications: Module-1-Attack-and-Web-Security/10-modern-apps-and-microfrontends/README.md
      - 12 · Security testing: Module-1-Attack-and-Web-Security/11-security-testing-and-tools/README.md
      - 13 · Prevention checklists: Module-1-Attack-and-Web-Security/12-prevention-checklists/README.md
      - Security bootcamp: Module-1-Attack-and-Web-Security/bootcamp/README.md
  - Module 2 · Full-Stack & Interview Prep:
      - Start here: Module-2-Full-Stack-and-Interview-Preparation/README.md
      - Core interview curriculum: Module-2-Full-Stack-and-Interview-Preparation/15-fullstack-interview/README.md
      - Frontend system design: Module-2-Full-Stack-and-Interview-Preparation/13-frontend-system-design/README.md
      - Communication patterns: Module-2-Full-Stack-and-Interview-Preparation/13-frontend-system-design/communication-patterns.md
      - High-level design: Module-2-Full-Stack-and-Interview-Preparation/13-frontend-system-design/high-level-design.md
      - Low-level design: Module-2-Full-Stack-and-Interview-Preparation/13-frontend-system-design/low-level-design.md
      - Performance & caching: Module-2-Full-Stack-and-Interview-Preparation/13-frontend-system-design/performance-and-caching.md
      - Offline, accessibility & observability: Module-2-Full-Stack-and-Interview-Preparation/13-frontend-system-design/offline-accessibility-observability.md
      - DevOps & deployment: Module-2-Full-Stack-and-Interview-Preparation/14-devops-and-deployment/README.md
      - GitHub Actions CI/CD: Module-2-Full-Stack-and-Interview-Preparation/14-devops-and-deployment/github-actions-cicd-fullstack.md
      - Full-stack deployment: Module-2-Full-Stack-and-Interview-Preparation/14-devops-and-deployment/how-to-deploy-fullstack-app.md
      - Multi-cloud deployment: Module-2-Full-Stack-and-Interview-Preparation/14-devops-and-deployment/multi-cloud-deployment-hostinger-gcp-aws.md
      - PM2, RabbitMQ & serverless: Module-2-Full-Stack-and-Interview-Preparation/14-devops-and-deployment/pm2-rabbitmq-and-serverless.md
  - Shared reference:
      - Glossary: resources/GLOSSARY.md
      - Official references: resources/OFFICIAL_REFERENCES.md
      - Security videos: resources/VIDEOS.md
      - Frontend system design videos: resources/FRONTEND_SYSTEM_DESIGN_VIDEOS.md
      - Labs: labs/README.md
      - Diagrams: diagrams/README.md
